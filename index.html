<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff4f5">
  <title>Happy Birthday, Khushi! ♡</title>
  <link rel="stylesheet" href="css/pastel-theme.css">
  <style>
    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      overflow: hidden;
      padding: 88px 20px 36px;
      background:
        radial-gradient(ellipse at 12% 18%, rgba(255, 255, 255, 0.8), transparent 30%),
        radial-gradient(ellipse at 88% 82%, rgba(255, 229, 217, 0.78), transparent 34%),
        linear-gradient(135deg, #fff1f4 0%, #f0e8ff 48%, #fff4e9 100%);
    }

    .welcome-card {
      position: relative;
      z-index: 2;
      width: min(100%, 700px);
      padding: clamp(32px, 6vw, 58px) 24px clamp(36px, 6vw, 54px);
      overflow: hidden;
      text-align: center;
      background: rgba(255, 253, 250, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.94);
      border-radius: 36px;
      box-shadow: 0 24px 70px rgba(104, 73, 117, 0.14), inset 0 1px 0 #fff;
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
      animation: card-arrive 850ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }

    .welcome-card::before,
    .welcome-card::after {
      position: absolute;
      z-index: -1;
      width: 190px;
      height: 190px;
      content: "";
      border-radius: 50%;
      filter: blur(2px);
      pointer-events: none;
    }

    .welcome-card::before {
      top: -115px;
      left: -90px;
      background: rgba(255, 214, 225, 0.5);
    }

    .welcome-card::after {
      right: -110px;
      bottom: -130px;
      background: rgba(222, 207, 255, 0.5);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 17px;
      padding: 8px 15px;
      color: #806187;
      background: #fff;
      border: 1px solid #f5e8f4;
      border-radius: 999px;
      box-shadow: 0 5px 16px rgba(104, 73, 117, 0.07);
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
    }

    .eyebrow span {
      color: #e58ca5;
    }

    h1 {
      margin: 0;
      color: #674b72;
      font-family: var(--font-script);
      font-size: clamp(2.6rem, 8vw, 4.7rem);
      font-weight: 400;
      line-height: 1.18;
      text-shadow: 0 5px 22px rgba(229, 140, 165, 0.2);
      animation: title-arrive 900ms 180ms both;
    }

    .subtitle {
      max-width: 440px;
      margin: 13px auto 0;
      color: #806e86;
      font-size: clamp(1rem, 2.8vw, 1.2rem);
      line-height: 1.7;
      animation: fade-up 750ms 350ms both;
    }

    .gift-scene {
      position: relative;
      display: grid;
      width: 190px;
      height: 190px;
      margin: 20px auto 21px;
      place-items: center;
      animation: gift-bob 3.2s ease-in-out infinite;
    }

    .gift-glow {
      position: absolute;
      bottom: 17px;
      width: 150px;
      height: 30px;
      background: rgba(202, 174, 231, 0.26);
      border-radius: 50%;
      filter: blur(10px);
    }

    .gift-box {
      position: absolute;
      bottom: 32px;
      width: 116px;
      height: 88px;
      background: linear-gradient(145deg, #f8b8c9, #ea91ad);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 10px 10px 14px 14px;
      box-shadow: 0 13px 22px rgba(193, 111, 143, 0.2);
    }

    .gift-box::before {
      position: absolute;
      top: 0;
      left: 43px;
      width: 25px;
      height: 100%;
      content: "";
      background: linear-gradient(90deg, #fff2cf, #ffe8ad);
      box-shadow: 0 2px 6px rgba(255, 255, 255, 0.3);
    }

    .gift-lid {
      position: absolute;
      z-index: 2;
      top: 51px;
      width: 132px;
      height: 26px;
      background: linear-gradient(180deg, #ffd1dc, #f6a9bd);
      border: 1px solid rgba(255, 255, 255, 0.8);
      border-radius: 9px;
      box-shadow: 0 7px 12px rgba(193, 111, 143, 0.15);
      animation: lid-wiggle 3.2s ease-in-out infinite;
    }

    .gift-lid::before {
      position: absolute;
      top: 0;
      left: 52px;
      width: 25px;
      height: 100%;
      content: "";
      background: linear-gradient(90deg, #fff2cf, #ffe8ad);
    }

    .bow {
      position: absolute;
      z-index: 3;
      top: 29px;
      left: 50%;
      width: 22px;
      height: 22px;
      border: 7px solid #cba9e8;
      border-radius: 50% 50% 50% 8px;
      transform: translateX(-100%) rotate(35deg);
    }

    .bow::after {
      position: absolute;
      top: -7px;
      left: 9px;
      width: 22px;
      height: 22px;
      content: "";
      border: 7px solid #cba9e8;
      border-radius: 50% 50% 8px 50%;
      transform: rotate(-70deg);
    }

    .gift-sparkle {
      position: absolute;
      color: #d7ad72;
      font-size: 1.4rem;
      animation: twinkle 2s ease-in-out infinite;
    }

    .sparkle-one { top: 30px; left: 24px; }
    .sparkle-two { top: 57px; right: 15px; animation-delay: 600ms; }
    .sparkle-three { right: 37px; bottom: 20px; font-size: 1rem; animation-delay: 1s; }

    .open-button {
      position: relative;
      display: inline-flex;
      min-height: 58px;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px 27px;
      overflow: hidden;
      color: #fff;
      background: linear-gradient(115deg, #e99bb1, #bba3e5 72%, #d7b8ed);
      border: 1px solid rgba(255, 255, 255, 0.78);
      border-radius: 999px;
      box-shadow: 0 12px 25px rgba(174, 132, 196, 0.28);
      font: 600 1rem var(--font-sans);
      text-decoration: none;
      text-shadow: 0 1px 2px rgba(94, 63, 109, 0.22);
      transition: transform 220ms ease, box-shadow 220ms ease, filter 220ms ease;
      animation: fade-up 750ms 500ms both;
    }

    .open-button::after {
      position: absolute;
      top: -30%;
      left: -70%;
      width: 45%;
      height: 160%;
      content: "";
      background: rgba(255, 255, 255, 0.28);
      transform: rotate(25deg);
      transition: left 450ms ease;
    }

    .open-button:hover {
      filter: saturate(1.08);
      box-shadow: 0 16px 30px rgba(174, 132, 196, 0.38);
      transform: translateY(-3px) scale(1.025);
    }

    .open-button:hover::after {
      left: 125%;
    }

    .open-button:focus-visible {
      outline: 3px solid #9a7ab4;
      outline-offset: 4px;
    }

    .personal-note {
      margin: 18px 0 0;
      color: #a28ea8;
      font-family: var(--font-handwriting);
      font-size: 1.35rem;
      animation: fade-up 750ms 650ms both;
    }

    .page-decor {
      position: fixed;
      z-index: 1;
      color: #e89ab0;
      opacity: 0.64;
      pointer-events: none;
      user-select: none;
      animation: decor-drift 7s ease-in-out infinite;
    }

    .decor-heart { top: 22%; left: 13%; font-size: 1.45rem; }
    .decor-flower { right: 13%; bottom: 20%; color: #c3a9df; font-size: 2rem; animation-delay: 1.2s; }
    .decor-sparkle { top: 19%; right: 20%; color: #dbb878; font-size: 1.4rem; animation-delay: 2s; }
    .decor-petal { bottom: 23%; left: 20%; color: #edae9b; font-size: 1.7rem; animation-delay: 800ms; }

    .audio-controls {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 1001;
      display: flex;
      align-items: center;
      gap: 9px;
      padding: 7px 12px;
      background: rgba(255, 255, 255, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 999px;
      box-shadow: 0 5px 18px rgba(104, 73, 117, 0.1);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
    }

    .audio-controls button {
      display: grid;
      width: 34px;
      height: 34px;
      padding: 0;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, #e99bb1, #bba3e5);
      border: 0;
      border-radius: 50%;
      cursor: pointer;
    }

    .audio-controls button:focus-visible,
    .audio-controls input:focus-visible {
      outline: 2px solid #9a7ab4;
      outline-offset: 3px;
    }

    .audio-controls input {
      width: 76px;
      accent-color: #bba3e5;
    }

    @keyframes card-arrive {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes title-arrive {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes gift-bob {
      0%, 100% { transform: translateY(0) rotate(-1deg); }
      50% { transform: translateY(-7px) rotate(1deg); }
    }

    @keyframes lid-wiggle {
      0%, 12%, 20%, 100% { transform: translateY(0) rotate(0); }
      16% { transform: translateY(-5px) rotate(-3deg); }
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.48; transform: scale(0.8) rotate(0); }
      50% { opacity: 1; transform: scale(1.15) rotate(18deg); }
    }

    @keyframes decor-drift {
      0%, 100% { transform: translateY(0) rotate(-7deg); }
      50% { transform: translateY(-10px) rotate(8deg); }
    }

    @media (max-width: 600px) {
      body {
        padding: 35px 16px 90px;
      }

      .welcome-card {
        padding: 34px 20px 35px;
        border-radius: 28px;
      }

      .gift-scene {
        margin-top: 15px;
        margin-bottom: 15px;
        transform: scale(0.92);
      }

      .open-button {
        width: min(100%, 330px);
        padding-inline: 16px;
        font-size: 0.95rem;
      }

      .page-decor {
        opacity: 0.42;
      }

      .decor-heart { top: 17%; left: 5%; }
      .decor-flower { right: 4%; bottom: 18%; }
      .decor-sparkle { top: 14%; right: 9%; }
      .decor-petal { bottom: 15%; left: 6%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <nav class="khushi-nav-bar" aria-label="Birthday surprise pages">
    <a href="index.html" class="active" aria-current="page">🌸 <span class="nav-text">Welcome</span></a>
    <a href="memorylane.html">📸 <span class="nav-text">Memories</span></a>
    <a href="cake.html">🎂 <span class="nav-text">Cake</span></a>
    <a href="letter.html">💌 <span class="nav-text">Letter</span></a>
  </nav>

  <span class="page-decor decor-heart" aria-hidden="true">♡</span>
  <span class="page-decor decor-flower" aria-hidden="true">✿</span>
  <span class="page-decor decor-sparkle" aria-hidden="true">✧</span>
  <span class="page-decor decor-petal" aria-hidden="true">❀</span>

  <main class="welcome-card">
    <p class="eyebrow"><span aria-hidden="true">✧</span> A little birthday magic <span aria-hidden="true">✧</span></p>
    <h1>Hey Khushi! ♡</h1>
    <p class="subtitle">Someone has prepared a little surprise for you...</p>

    <div class="gift-scene" role="img" aria-label="A softly glowing pink gift box with a lavender ribbon">
      <span class="gift-sparkle sparkle-one" aria-hidden="true">✧</span>
      <span class="gift-sparkle sparkle-two" aria-hidden="true">✦</span>
      <span class="gift-sparkle sparkle-three" aria-hidden="true">✧</span>
      <span class="gift-glow" aria-hidden="true"></span>
      <span class="gift-box" aria-hidden="true"></span>
      <span class="gift-lid" aria-hidden="true"></span>
      <span class="bow" aria-hidden="true"></span>
    </div>

    <a class="open-button" href="memorylane.html">Open Your Surprise 🎁</a>
    <p class="personal-note">Made with lots of love, just for you ♡</p>
  </main>

  <div class="audio-controls" aria-label="Background music controls">
    <button id="play-pause" type="button" aria-label="Play or pause birthday music">▶️</button>
    <input type="range" id="volume" min="0" max="1" step="0.1" value="0.5" aria-label="Music volume">
  </div>

  <audio id="birthday-song" loop>
    <source src="Happy_birthday_english.mp3" type="audio/mp3">
    Your browser does not support the audio element.
  </audio>

  <script src="js/pastel-particles.js"></script>
  <script>
    const audio = document.getElementById('birthday-song');
    const volumeControl = document.getElementById('volume');

    audio.volume = Number(volumeControl.value);
    volumeControl.addEventListener('input', () => {
      audio.volume = Number(volumeControl.value);
    });
  </script>
</body>
</html>
