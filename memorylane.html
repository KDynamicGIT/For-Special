<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff4f5">
  <title>Our Little Memory Lane ♡ | For Khushi</title>
  <link rel="stylesheet" href="css/pastel-theme.css">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      overflow-x: hidden;
      padding: 92px 20px 50px;
      background:
        radial-gradient(ellipse at 12% 18%, rgba(255, 255, 255, 0.78), transparent 30%),
        radial-gradient(ellipse at 88% 82%, rgba(255, 229, 217, 0.72), transparent 34%),
        linear-gradient(135deg, #fff1f4 0%, #f0e8ff 48%, #fff4e9 100%);
    }

    .scrapbook-bg {
      position: fixed;
      z-index: 0;
      inset: 0;
      background-image: radial-gradient(rgba(185, 157, 213, 0.17) 1px, transparent 1px);
      background-size: 30px 30px;
      pointer-events: none;
    }

    .confetti-layer {
      position: fixed;
      z-index: 0;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .confetti-piece {
      position: absolute;
      top: -18px;
      opacity: 0;
      animation: confetti-fall 10s ease-in infinite;
    }

    .page-decoration {
      position: fixed;
      z-index: 1;
      color: #e89ab0;
      opacity: 0.65;
      pointer-events: none;
      user-select: none;
      animation: decoration-drift 7s ease-in-out infinite;
    }

    .decoration-heart { top: 20%; left: 5%; font-size: 1.8rem; }
    .decoration-sparkle { top: 23%; right: 7%; color: #d3ae72; font-size: 1.5rem; animation-delay: 1s; }
    .decoration-flower { right: 5%; bottom: 17%; color: #c2a5df; font-size: 2rem; animation-delay: 2s; }
    .decoration-twinkle { bottom: 13%; left: 8%; color: #d3ae72; font-size: 1.2rem; animation-delay: 600ms; }

    .memory-page {
      position: relative;
      z-index: 2;
      width: min(100%, 1180px);
      margin: 0 auto;
    }

    .page-header {
      max-width: 760px;
      margin: 0 auto 34px;
      text-align: center;
      animation: fade-up 750ms ease-out both;
    }

    .page-header .khushi-badge {
      margin-bottom: 12px;
    }

    .page-header h1 {
      margin: 0;
      color: #674b72;
      background: linear-gradient(120deg, #d47a94, #8e65b5);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      font-family: var(--font-script);
      font-size: clamp(2.15rem, 5.5vw, 3.8rem);
      font-weight: 400;
      line-height: 1.25;
      text-shadow: 0 5px 22px rgba(229, 140, 165, 0.16);
    }

    .page-header p {
      width: fit-content;
      max-width: 100%;
      margin: 14px auto 0;
      padding: 9px 20px;
      color: #806e86;
      background: rgba(255, 255, 255, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.92);
      border-radius: 999px;
      box-shadow: 0 6px 18px rgba(104, 73, 117, 0.07);
      font-size: clamp(0.95rem, 2.5vw, 1.1rem);
      line-height: 1.6;
    }

    .slideshow-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 12px;
    }

    .slideshow-controls button {
      min-height: 42px;
      padding: 9px 18px;
      color: #70557e;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.96);
      border-radius: 999px;
      box-shadow: 0 6px 17px rgba(104, 73, 117, 0.09);
      cursor: pointer;
      font: 600 0.9rem var(--font-sans);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .slideshow-controls button:hover {
      box-shadow: 0 9px 21px rgba(174, 132, 196, 0.2);
      transform: translateY(-2px);
    }

    .slideshow-controls button:focus-visible,
    .page-navigation a:focus-visible {
      outline: 3px solid #9a7ab4;
      outline-offset: 3px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 26px;
      padding: 18px 4px 24px;
    }

    .memory-card {
      --tilt: 0deg;
      position: relative;
      min-width: 0;
      padding: 10px 10px 14px;
      background: rgba(255, 253, 250, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.96);
      border-radius: 20px;
      box-shadow: 0 12px 30px rgba(73, 54, 83, 0.12), 0 2px 6px rgba(73, 54, 83, 0.04);
      transform: rotate(var(--tilt));
      animation: photo-arrive 650ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
      animation-delay: var(--delay, 0ms);
      transition: transform 280ms ease, box-shadow 280ms ease;
    }

    .memory-card::before {
      position: absolute;
      z-index: 2;
      top: -9px;
      left: 50%;
      width: 66px;
      height: 20px;
      content: "";
      background: rgba(245, 220, 229, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 3px;
      box-shadow: 0 2px 6px rgba(104, 73, 117, 0.08);
      transform: translateX(-50%) rotate(-3deg);
    }

    .memory-card:hover,
    .memory-card.is-current {
      z-index: 3;
      box-shadow: 0 20px 40px rgba(174, 132, 196, 0.24);
      transform: translateY(-6px) rotate(0) scale(1.015);
    }

    .memory-card:focus-within {
      outline: 2px solid #bba3e5;
      outline-offset: 4px;
    }

    .photo-frame {
      overflow: hidden;
      background: linear-gradient(135deg, #f8e6ed, #e9ddfb);
      border-radius: 13px;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.72);
    }

    .memory-img {
      display: block;
      width: 100%;
      aspect-ratio: 4 / 5;
      object-fit: cover;
      object-position: center;
      background: #f7eaf0;
      transition: transform 400ms ease, filter 400ms ease;
    }

    .memory-card:hover .memory-img,
    .memory-card.is-current .memory-img {
      filter: saturate(1.06);
      transform: scale(1.045);
    }

    .memory-img.image-unavailable {
      object-fit: contain;
      padding: 20px;
    }

    .memory-caption {
      display: flex;
      min-height: 58px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin: 8px 2px 0;
      color: #725b7d;
      font-family: var(--font-handwriting);
      font-size: clamp(1.15rem, 1.8vw, 1.4rem);
      line-height: 1.25;
      text-align: center;
    }

    .memory-caption span {
      color: #e49ab0;
      font-family: var(--font-sans);
      font-size: 0.8rem;
    }

    .page-navigation {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      margin: 22px auto 12px;
      animation: fade-up 700ms 450ms ease-out both;
    }

    .page-navigation a {
      min-height: 50px;
      padding: 12px 23px;
    }

    .page-navigation .btn-pastel-primary {
      color: #fff;
      background: linear-gradient(115deg, #e99bb1, #bba3e5 72%, #d7b8ed);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 10px 23px rgba(174, 132, 196, 0.27);
    }

    .page-navigation .btn-pastel-primary:hover {
      background: linear-gradient(115deg, #e99bb1, #bba3e5 72%, #d7b8ed);
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes photo-arrive {
      from { opacity: 0; transform: translateY(18px) rotate(var(--tilt)); }
      to { opacity: 1; transform: translateY(0) rotate(var(--tilt)); }
    }

    @keyframes decoration-drift {
      0%, 100% { transform: translateY(0) rotate(-8deg); }
      50% { transform: translateY(-10px) rotate(8deg); }
    }

    @keyframes confetti-fall {
      0% { opacity: 0; transform: translateY(-12vh) rotate(0deg); }
      12% { opacity: 0.55; }
      100% { opacity: 0; transform: translateY(110vh) rotate(540deg); }
    }

    @media (max-width: 1020px) {
      .gallery {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 22px;
      }
    }

    @media (max-width: 720px) {
      body {
        padding: 82px 16px 40px;
      }

      .khushi-nav-bar {
        position: absolute;
        top: 10px;
        bottom: auto;
      }

      .page-header {
        margin-bottom: 25px;
      }

      .gallery {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 18px;
        padding: 16px 2px 20px;
      }

      .memory-card {
        padding: 8px 8px 10px;
        border-radius: 17px;
      }

      .memory-caption {
        min-height: 56px;
        margin-top: 6px;
        font-size: clamp(1.05rem, 3.8vw, 1.25rem);
      }

      .page-decoration {
        opacity: 0.4;
      }

      .decoration-heart { top: 18%; left: 2%; }
      .decoration-sparkle { top: 21%; right: 3%; }
      .decoration-flower { right: 2%; bottom: 14%; }
      .decoration-twinkle { bottom: 12%; left: 3%; }
    }

    @media (max-width: 360px) {
      body {
        padding-right: 12px;
        padding-left: 12px;
      }

      .gallery {
        gap: 12px;
      }

      .memory-caption {
        font-size: 1rem;
      }

      .page-navigation a {
        width: min(100%, 300px);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <nav class="khushi-nav-bar" aria-label="Birthday surprise pages">
    <a href="index.html">🌸 <span class="nav-text">Welcome</span></a>
    <a href="memorylane.html" class="active" aria-current="page">📸 <span class="nav-text">Memories</span></a>
    <a href="cake.html">🎂 <span class="nav-text">Cake</span></a>
    <a href="letter.html">💌 <span class="nav-text">Letter</span></a>
  </nav>

  <div class="scrapbook-bg" aria-hidden="true"></div>
  <div class="confetti-layer" id="confetti-container" aria-hidden="true"></div>
  <span class="page-decoration decoration-heart" aria-hidden="true">♡</span>
  <span class="page-decoration decoration-sparkle" aria-hidden="true">✧</span>
  <span class="page-decoration decoration-flower" aria-hidden="true">✿</span>
  <span class="page-decoration decoration-twinkle" aria-hidden="true">✦</span>

  <main class="memory-page">
    <header class="page-header">
      <span class="khushi-badge">A little album, made with love ♡</span>
      <h1>Our Little Memory Lane ♡</h1>
      <p>Every picture holds a little piece of happiness.</p>
    </header>

    <div class="slideshow-controls" aria-label="Photo slideshow controls">
      <button id="startSlideshow" type="button" aria-controls="memoryGallery">▶ Start slideshow</button>
      <button id="pauseSlideshow" type="button" aria-controls="memoryGallery" hidden>⏸ Pause slideshow</button>
    </div>

    <section class="gallery" id="memoryGallery" aria-label="Eight birthday memory photos"></section>

    <nav class="page-navigation" aria-label="Continue through the birthday surprise">
      <a class="btn-pastel-secondary" href="index.html">← Back to Welcome</a>
      <a class="btn-pastel-primary" href="cake.html">Continue to Your Cake💌 →</a>
    </nav>
  </main>

  <script src="js/pastel-particles.js"></script>
  <script>
    const memories = [
      { image: "1.jpeg", caption: "A little moment worth keeping", emoji: "✧", alt: "Illustrated moonlit evening beneath a starry sky" },
      { image: "2.jpeg", caption: "One for the happy-days album", emoji: "♡", alt: "Illustrated friends sharing a sunny day" },
      { image: "3.jpeg", caption: "A snapshot full of smiles", emoji: "✿", alt: "Illustrated evening view over a glowing city" },
      { image: "4.jpeg", caption: "A sweet little memory", emoji: "♪", alt: "Illustrated music by the moonlit seaside" },
      { image: "5.jpeg", caption: "The kind of day we love", emoji: "☀", alt: "Illustrated picnic under a leafy tree" },
      { image: "6.jpeg", caption: "A frame full of sunshine", emoji: "✧", alt: "Illustrated friends surrounded by flowers" },
      { image: "7.jpeg", caption: "Keep this one close", emoji: "♡", alt: "Illustrated stroll through a flower garden" },
      { image: "8.jpeg", caption: "A little sparkle, just for you", emoji: "✦", alt: "Illustrated evening beneath glowing string lights" },
    ];

    const gallery = document.getElementById("memoryGallery");
    const startButton = document.getElementById("startSlideshow");
    const pauseButton = document.getElementById("pauseSlideshow");
    const confettiContainer = document.getElementById("confetti-container");
    const cards = [];
    let slideshowTimer = null;
    let currentSlide = -1;

    function createMemoryCard(memory, index) {
      const card = document.createElement("article");
      card.className = "memory-card";
      card.style.setProperty("--tilt", `${[-1.2, 1.1, -0.7, 1.3, 0.8, -1.1, 1.2, -0.8][index]}deg`);
      card.style.setProperty("--delay", `${index * 75}ms`);

      const frame = document.createElement("div");
      frame.className = "photo-frame";

      const image = document.createElement("img");
      image.className = "memory-img";
      image.src = memory.image;
      image.alt = memory.alt;
      image.loading = "eager";
      image.decoding = "async";
      image.addEventListener("error", () => {
        image.classList.add("image-unavailable");
        image.alt = `${memory.alt} (image could not be loaded)`;
        console.error(`Could not load memory photo: ${memory.image}`);
      }, { once: true });

      const caption = document.createElement("p");
      caption.className = "memory-caption";
      caption.append(document.createTextNode(memory.caption));
      const heart = document.createElement("span");
      heart.setAttribute("aria-hidden", "true");
      heart.textContent = memory.emoji;
      caption.appendChild(heart);

      frame.appendChild(image);
      card.append(frame, caption);
      gallery.appendChild(card);
      cards.push(card);
    }

    function createConfetti() {
      const colors = ["#f5bccb", "#cbb4f7", "#f7c7b5", "#fff0f5", "#d9c7f0"];
      for (let index = 0; index < 24; index += 1) {
        const piece = document.createElement("span");
        piece.className = "confetti-piece";
        piece.style.left = `${Math.random() * 100}%`;
        piece.style.width = `${5 + Math.random() * 7}px`;
        piece.style.height = `${5 + Math.random() * 9}px`;
        piece.style.backgroundColor = colors[index % colors.length];
        piece.style.borderRadius = index % 2 ? "50%" : "3px";
        piece.style.animationDelay = `${Math.random() * 9}s`;
        piece.style.animationDuration = `${8 + Math.random() * 6}s`;
        confettiContainer.appendChild(piece);
      }
    }

    function showSlide(index) {
      cards.forEach((card) => card.classList.remove("is-current"));
      const card = cards[index];
      card.classList.add("is-current");
      card.scrollIntoView({
        behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth",
        block: "center",
      });
    }

    function advanceSlideshow() {
      currentSlide = (currentSlide + 1) % cards.length;
      showSlide(currentSlide);
    }

    function startSlideshow() {
      if (slideshowTimer !== null) return;
      startButton.hidden = true;
      pauseButton.hidden = false;
      advanceSlideshow();
      slideshowTimer = window.setInterval(advanceSlideshow, 2600);
    }

    function pauseSlideshow() {
      if (slideshowTimer !== null) {
        window.clearInterval(slideshowTimer);
        slideshowTimer = null;
      }
      pauseButton.hidden = true;
      startButton.hidden = false;
      cards.forEach((card) => card.classList.remove("is-current"));
    }

    memories.forEach(createMemoryCard);
    createConfetti();
    startButton.addEventListener("click", startSlideshow);
    pauseButton.addEventListener("click", pauseSlideshow);
    window.addEventListener("pagehide", pauseSlideshow, { once: true });
  </script>
</body>
</html>
